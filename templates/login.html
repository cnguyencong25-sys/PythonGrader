<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Python Grader</title>
  <link rel="icon" type="image/png" href="/static/img/Vimaru.png">
  <script src="/static/js/student_theme.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  {% include "_auth_theme_controls.html" %}
  <div class="auth-wrapper">
    <main class="auth-login-layout">
      {% include "_auth_brand_banner.html" %}
      <section class="auth-box" aria-labelledby="loginTitle">
        <div class="login-mascot-stage">
          <canvas id="loginMascot" width="520" height="280"
                  role="img" aria-label="Mascot hoạt hình tương tác"></canvas>
        </div>
        <h2 id="loginTitle">Đăng nhập</h2>
        <form id="loginForm" autocomplete="on">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required autofocus>

          <label for="password">Mật khẩu</label>
          <div class="auth-password-field">
            <input type="password" id="password" placeholder="••••••••" required minlength="8"
                   data-private-password>
            {% with toggle_id="togglePasswordVisibility", password_id="password" %}
              {% include "_password_visibility_toggle.html" %}
            {% endwith %}
          </div>

          <button type="submit">Đăng nhập</button>
        </form>
        <p id="message" class="message"></p>
        <p class="switch-link">
          Sinh viên chưa có tài khoản?
          <a href="/register">Đăng ký ngay</a>
        </p>
      </section>
    </main>
  </div>
  <script src="https://unpkg.com/@rive-app/webgl2@2.40.1"></script>
  <script src="/static/js/login_mascot.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
  // Hiển thị lý do bị đăng xuất (nếu có)
  (function () {
    const params = new URLSearchParams(window.location.search);
    let reason = params.get("expired");
// Nếu reason có dạng "revoked:xxx" -> lấy phần sau dấu ":"
    if (reason && reason.startsWith("revoked:")) {
        reason = reason.split(":")[1];
}
    if (!reason) return;

    const messages = {
        token: "Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại",
        idle_timeout: " Bạn đã bị đăng xuất do không hoạt động quá 50 phút.",
        another_login: " Tài khoản của bạn vừa được đăng nhập ở một thiết bị khác. Vui lòng đăng nhập lại nếu muốn tiếp tục.",
        revoked_another_login: " Tài khoản của bạn vừa được đăng nhập ở một thiết bị khác. Vui lòng đăng nhập lại nếu muốn tiếp tục.",
        force_logout: " Tài khoản đã bị đăng xuất từ xa.",
        session_not_found: " Phiên đăng nhập không còn hợp lệ.",
        missing_session: " Vui lòng đăng nhập lại.",
    };
    const msg = document.getElementById("message");
    if (msg) {
      msg.textContent = messages[reason] || "Phiên đăng nhập đã hết hạn.";
      msg.className = "message error";
    }
  })();
</script>
<script src="/static/js/auth_transition.js"></script>
<script src="/static/js/login_snow.js"></script>
<script src="/static/js/auth_mascot.js"></script>
</body>
</html>
