<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký — Python Grader</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="brand-mark" aria-hidden="true">⌘</div>
      <h1 class="brand">Python Grader</h1>
      <p class="auth-tagline">Tạo tài khoản sinh viên của bạn</p>
      <h2>Đăng ký tài khoản sinh viên</h2>
      <form id="registerForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="sv@example.com" required>

        <label for="password">Mật khẩu (≥ 8 ký tự)</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="8">

        <label for="confirm_password">Xác nhận mật khẩu</label>
        <input type="password" id="confirm_password" placeholder="••••••••" required minlength="8">

        <button type="submit">Đăng ký</button>
      </form>
      <p id="message" class="message"></p>
      <p class="switch-link">
        Đã có tài khoản? <a href="/login">Đăng nhập</a>
      </p>
    </div>
  </div>
  <script src="/static/js/auth.js"></script>
</body>
</html>
